name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Record dependency lock snapshot
        run: |
          echo 'BEGIN_RESOLVED_LOCKFILE'
          base64 -w0 package-lock.json
          echo
          echo 'END_RESOLVED_LOCKFILE'
      - name: Check mathematics
        run: npm test
      - name: Build
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Upload failing browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore
