# Configuración preparada para el primer despliegue; no crea recursos hasta
# vincular expresamente este repositorio con un Blueprint en Render.
services:
  - type: web
    name: xcurvefitlab-playground
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
